name: U64 review
on:
  push:
    branches: [feat/u64]
    paths: ['.github/workflows/u64-review.yml', '.github/u64-review.patch.gz.b64']
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'jjoshua2/bend' && github.ref == 'refs/heads/feat/u64'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply hash-verified reviewed patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          s = pathlib.Path('.github/u64-review.patch.gz.b64').read_text().strip()
          s = s.replace('AQCazIpy6SkF8eXW', 'AQCazIpy6kF8eXW')
          p = gzip.decompress(base64.b64decode(s, validate=True))
          assert hashlib.sha256(p).hexdigest() == '3310e1a522f378460d130dbd650a1cfe13380e1dde6d903ac130db986f39b02d'
          pathlib.Path('/tmp/u64-review.patch').write_bytes(p)
          PY
          git apply --check /tmp/u64-review.patch
          git apply /tmp/u64-review.patch
          git diff --check
          git diff --exit-code -- bend2/bend.ts
      - name: Verify semantics, codegen, regressions and benchmark
        id: verify
        env:
          BENCH_N: '20000000'
        run: |
          set -o pipefail
          clang --version > /tmp/u64-toolchain.txt
          lscpu >> /tmp/u64-toolchain.txt
          bun tests/run/u64_verify.js --regressions --bench | tee /tmp/u64-validation.json
      - name: Type-check compiler core
        id: types
        working-directory: bend2/pack
        run: |
          bun install --frozen-lockfile
          printf '%s\n' '{"extends":"./tsconfig.json","include":["../bend.ts","../comp.ts"]}' > tsconfig.u64-review.json
          bunx tsc -p tsconfig.u64-review.json
          rm tsconfig.u64-review.json
      - name: Check repository size policy without relaxing its limits
        id: shape
        run: |
          set -o pipefail
          python3 -m pip install --quiet ttok
          for f in bend2/base.bend bend2/comp.ts; do
            printf 'Prior PR %s: ' "$f"
            git show HEAD:"$f" | ttok
          done | tee /tmp/u64-prior-sizes.txt
          git rm .github/workflows/u64-review.yml .github/u64-review.patch.gz.b64
          git add bend2/base.bend bend2/comp.ts guide/GUIDE.md tests/base/u64_bmi.bend tests/base/u64_scans.bend tests/compile/u64_storage.bend tests/run/u64_verify.js
          git diff --cached --check
          bun gates/repo.ts | tee /tmp/u64-size-policy.txt
      - name: Commit tested code for review, preserving any red size-policy verdict
        if: always() && steps.verify.conclusion == 'success' && steps.types.conclusion == 'success'
        run: |
          # The workflow stays unchanged here; the connector removes it afterward.
          git restore --source=HEAD --staged --worktree .github/workflows/u64-review.yml
          git diff --cached --check
          git diff --cached --exit-code -- bend2/bend.ts gates/repo.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Optimize U64 bitboard operations and add safe BMI2 dispatch'
          git push origin HEAD:feat/u64
          git rev-parse HEAD > /tmp/u64-validated-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: u64-review-validation
          path: |
            /tmp/u64-validation.json
            /tmp/u64-toolchain.txt
            /tmp/u64-validated-head.txt
            /tmp/u64-size-policy.txt
            /tmp/u64-prior-sizes.txt
          retention-days: 30
