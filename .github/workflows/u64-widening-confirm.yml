name: U64 widening confirmation
on:
  push:
    branches: [fix/u64-widening-dev]
permissions:
  contents: write
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Add the variable-operand regression
        run: |
          cat > tests/base/u64_from_u32_variable.bend <<'EOF'
          # Reusing a u32 C local must not defeat the widening before high-half extraction.
          import Base

          def fill(n: Nat, +i: U32, +value: U32, a: Array<U64>) -> Array<U64>:
            match n:
              case 0n: a
              case 1n+p:
                fill(p, U32.inc(i), U32.inc(value), Array.set(U64, a, i, U64.from_u32(value)))

          def inspect(expected: U32, r: Array<U64> & U64) -> Array<U64> & U32:
            (a, +v) = r
            (a, Bool.to_u32(Bool.and(U32.is_zero(U64.high(v)), U32.is_eq(U64.low(v), expected))))

          def add(n: U32, r: Array<U64> & U32) -> Array<U64> & U32:
            (a, ok) = r
            (a, U32.add(n, ok))

          def step(+i: U32, expected: U32, r: Array<U64> & U32) -> Array<U64> & U32:
            (a, n) = r
            add(n, inspect(expected, Array.get(U64, a, i)))

          def check(n: Nat, +i: U32, +expected: U32, r: Array<U64> & U32) -> U32:
            match n:
              case 0n:
                (a, good) = r
                good
              case 1n+p: check(p, U32.inc(i), U32.inc(expected), step(i, expected, r))

          def batch(+initial: U32) -> U32:
            check(4n, 0, initial, (fill(4n, 0, initial, Array.new(U64, 2n, U64.zero())), 0))

          def main() -> U32:
            U32.add(batch(2147483646), batch(4294967294))

          #|8
          EOF
          echo '897854fbff31b0925a7d7bcb1628782e7b750987ea04ee211d7fc59408449709  tests/base/u64_from_u32_variable.bend' | sha256sum -c -
      - name: Demonstrate the old compiler fails strict C compilation
        run: |
          bun bend2/main.ts tests/base/u64_from_u32_variable.bend -o /tmp/before.c
          if clang -O2 -Werror=shift-count-overflow /tmp/before.c -pthread -lm -o /tmp/before 2>/tmp/before.log; then
            echo 'Regression did not reproduce'; exit 1
          fi
          grep 'shift count' /tmp/before.log
      - name: Widen before alias reuse and high-half extraction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bend2/comp.ts')
          s = p.read_text()
          old = 'from_u32: "$0"'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'from_u32: "((u64)$0)"'))
          PY
          echo 'ebc081ec349b4bb90e91edb32086bb56ea7cacc18e6f01987288d2c3485f5204  bend2/comp.ts' | sha256sum -c -
          test "$(bun bend2/main.ts tests/base/u64_from_u32_variable.bend)" = 8
          bun bend2/main.ts tests/base/u64_from_u32_variable.bend -o /tmp/after.js
          test "$(bun /tmp/after.js)" = 8
          bun bend2/main.ts tests/base/u64_from_u32_variable.bend -o /tmp/after.c
          for flags in '' '-DBEND_U64_PORTABLE' '-march=native' '-fsanitize=undefined -fno-sanitize-recover=all'; do
            clang -O2 -Werror=shift-count-overflow $flags /tmp/after.c -pthread -lm -o /tmp/after
            test "$(/tmp/after --threads 1)" = 8
          done
      - name: Preserve existing U64 and array regressions
        run: bun tests/run/u64_verify.js --regressions
      - name: Publish only tested compiler and regression
        run: |
          git fetch --no-tags --depth=1 origin 57bc84edc0df32780e2c4dde44e3a2ee1a500cc9
          git read-tree 57bc84edc0df32780e2c4dde44e3a2ee1a500cc9
          git add bend2/comp.ts tests/base/u64_from_u32_variable.bend
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit="$(git commit-tree "$(git write-tree)" -p 57bc84edc0df32780e2c4dde44e3a2ee1a500cc9 -m 'Widen U32 locals before splitting native U64 results')"
          git push origin "$commit":refs/heads/fix/u64-from-u32-widening
          echo "$commit" > /tmp/u64-widening-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: u64-widening-confirmation
          path: /tmp/u64-widening-commit.txt
